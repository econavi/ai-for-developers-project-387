name: lighthouse

# Ночной аудит качества фронтенда через Lighthouse CLI с отчётом для команды.
#
# Ограничения GitHub: расписание срабатывает только для версии workflow на
# дефолтной ветке (main), поэтому правки этого файла «включаются» после мерджа.
# GitHub также автоматически отключает расписание после 60 дней неактивности
# в репозитории — при возобновлении работы достаточно перезапустить вручную.
on:
  schedule:
    # cron всегда интерпретируется в UTC: 23:23 UTC = 02:23 МСК следующего дня.
    # Минута 23 выбрана специально: прогоны «на ровном часе» GitHub троттлит,
    # задержки достигают получаса — смещение даёт предсказуемое время старта.
    - cron: "23 23 * * *"
  workflow_dispatch:

# Ночной и ручной прогоны одновременно бессмысленны и конфликтуют за порты,
# поэтому новый запуск отменяет начатый. Группа захардкожена, а не завязана
# на github.ref: иначе ручной запуск из ветки не отменил бы ночной прогон,
# хотя раннеры у них общие только по смыслу, а конфликт портов общий всегда.
concurrency:
  group: lighthouse-nightly
  cancel-in-progress: true

permissions:
  contents: read      # чтение кода; пушить агенту ничего не нужно
  issues: write       # агент создаёт/обновляет скользящий issue с отчётом
  id-token: write     # требуется экшену opencode для подтверждения подлинности

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          # persist-credentials: false — агенту нужен только GitHub API (issues),
          # а не git-креденшелы. Без этого GITHUB_TOKEN попадает в git config,
          # и агент может «успешно» начать пушить; с read-only правами это всё
          # равно упадёт с 403, но уже посреди прогона. Так попытка отсекается
          # сразу на этапе аутентификации.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Start backend
        working-directory: ./backend
        # npm start = tsx src/index.ts без watch: вотчер нужен только разработчику,
        # в CI процесс просто обязан держать порт 3001 до конца прогона.
        run: npm start &

      - name: Start frontend preview server
        working-directory: ./frontend
        # Аудит делаем по прод-сборке (vite preview), а не по дев-серверу:
        # неминифицированный код дев-сервера занижает performance-баллы.
        # preview наследует proxy из server.proxy, поэтому /api уходит в бэкенд.
        run: npx vite preview --port 4173 --strictPort &

      - name: Wait for servers
        run: |
          # Третий запрос идёт через preview-прокси (/api): только он ловит
          # отвалившийся прокси явно. В отличие от GET / на :3001 (тот отвечает
          # 404), у /api/event-types проверяем статус 2xx — упавший бэкенд или
          # битый роут падают здесь, а не нулевыми баллами в отчёте.
          # Первые два запроса проверяют только связность TCP, без --fail:
          # строгая проверка статуса сломала бы ожидание на корневых 404.
          for i in $(seq 1 60); do
            if curl -s --max-time 2 -o /dev/null http://localhost:3001 \
              && curl -s --max-time 2 -o /dev/null http://localhost:4173 \
              && curl -s --max-time 2 -o /dev/null -w '%{http_code}' http://localhost:4173/api/event-types | grep -q '^2'; then
              echo "Серверы и прокси поднялись"
              exit 0
            fi
            sleep 2
          done
          echo "Серверы не поднялись за 2 минуты" >&2
          exit 1

      - name: Run Lighthouse
        run: |
          # Отчёт пишем в runner.temp, а не в рабочее дерево: дерево остаётся
          # чистым, и у агента физически не появляются незакоммиченные файлы,
          # которые провоцировали его на коммит (инцидент 2026-08-21).
          REPORT_DIR="${{ runner.temp }}/lighthouse"
          mkdir -p "$REPORT_DIR"
          # Мажор CLI закреплён: баллы между ночами должны быть сопоставимы,
          # а свежий мажорный релиз lighthouse не должен неожиданно сломать
          # прогон или молча поменять методику оценки.
          npx -y lighthouse@12 http://localhost:4173 \
            --output=json --output=html \
            --output-path="$REPORT_DIR/report" \
            --only-categories=performance,accessibility,best-practices,seo \
            --chrome-flags="--headless=new"
          # При нескольких форматах Lighthouse добавляет к пути суффикс ".report":
          # получаются report.report.json / report.report.html. Переименовываем в
          # предсказуемые имена, чтобы шаги ниже не зависели от этой особенности CLI.
          mv "$REPORT_DIR/report.report.json" "$REPORT_DIR/report.json"
          mv "$REPORT_DIR/report.report.html" "$REPORT_DIR/report.html"

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report-${{ github.run_id }}
          path: ${{ runner.temp }}/lighthouse/
          retention-days: 90

      - name: Configure git identity
        # Промпт запрещает агенту пушить коммиты, но он всё равно может выполнять
        # локальные git-операции (например, commit при исследовании репозитория).
        # Без identity git падает с "Author identity unknown", а шаг агента —
        # с exit 1, хотя отчёт к этому моменту уже опубликован в issue.
        run: |
          git config --global user.name "opencode-bot"
          git config --global user.email "opencode-bot@users.noreply.github.com"

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: opencode/big-pickle
          use_github_token: true
          prompt: |
            Прочитай JSON-файл отчёта Lighthouse в каталоге $RUNNER_TEMP/lighthouse/
            (env RUNNER_TEMP доступен в шелле; каталог лежит вне рабочего дерева
            репозитория). Это ночной аудит фронтенда сервиса бронирования звонков.

            Задача — поддерживать РОВНО ОДИН открытый issue с лейблом "lighthouse":

            1. Найди среди открытых issues репозитория issue с лейблом "lighthouse".
               Если лейбла ещё нет — создай его.
            2. Если такой issue есть — добавь туда комментарий с итогами сегодняшнего
               прогона и обнови чек-лист правок в теле issue. Новый issue не создавай.
            3. Если его нет — создай issue с заголовком
               "Lighthouse: аудит качества фронтенда" и лейблом "lighthouse".

            Содержание отчёта:
            - оценки по категориям: performance, accessibility, best-practices, seo;
            - топ проблемных аудитов по приоритету (сначала те, что сильнее всего
              влияют на баллы);
            - конкретные рекомендуемые правки в коде проекта.

            Пиши по-русски. Работай ТОЛЬКО с issue через GitHub API.

            Строго запрещены любые git-операции записи (add, commit, push):
            у токена нет прав на запись в репозиторий, и любая попытка пуша
            роняет весь прогон. Ошибка аутентификации git — ожидаемое следствие
            этой защиты: не пытайся её «починить», в том числе через GITHUB_TOKEN
            или настройку credential helper. Код репозитория только читается —
            изменять файлы рабочего дерева не нужно ни для каких целей.

      - name: Notify about failure
        # Падение ночного прогона не должно быть невидимым: команда утром смотрит
        # issue, а не Actions. Шаг срабатывает при отказе любого предыдущего шага
        # (серверы, Lighthouse, агент) и оставляет след в скользящем issue.
        # На отмену прогона (concurrency cancel) шаг сознательно не реагирует:
        # отмена означает «пришёл более свежий запуск», а не поломку.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          HTTP_CODE=$(curl -sf -o /tmp/issues.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues?labels=lighthouse&state=open") || HTTP_CODE=000
          # /issues возвращает и PR: фильтруем по отсутствию поля pull_request,
          # иначе при лейбле на PR уведомление ушло бы туда вместо issue.
          ISSUE=$(jq -r '[.[] | select(has("pull_request") | not)][0].number // empty' /tmp/issues.json 2>/dev/null)
          if [ -z "$ISSUE" ]; then
            # Различаем «issue нет» и «API не ответил»: во втором случае код
            # остаётся в логе Actions для диагностики молча потерянных уведомлений.
            echo "Issue не найден или API недоступен (HTTP $HTTP_CODE)"
            exit 0
          fi
          BODY=$(jq -n --arg url "$RUN_URL" \
            '{"body": ("⚠️ Ночной аудит Lighthouse не завершился. Логи прогона: " + $url)}')
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE/comments" \
            -d "$BODY" > /dev/null
