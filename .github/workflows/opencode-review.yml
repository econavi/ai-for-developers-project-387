name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  opencode-review:
    # Включаем проверку так, чтобы бот реагировал на код человека.
    # PR от bot-аккаунтов пропускаем по account type (надёжнее суффикса [bot]).
    #
    # Дополнительно отсекаем события, триггером которых стал сам агент: по команде /oc
    # он пушит коммиты в ветку PR от имени github-actions[bot], что создаёт событие
    # synchronize с actor=github-actions[bot]. Экшен opencode github run для
    # pull_request-событий требует права записи у актора события, а у бота их нет
    # (permission: none) — без этой проверки каждый пуш агента либо падает с ошибкой
    # "does not have write permissions", либо зависает в статусе action_required.
    # Для актора проверка остаётся по суффиксу: поля .type у github.actor
    # в выражениях Actions нет — это ограничение платформы, не недосмотр.
    if: ${{ github.event.pull_request.user.type != 'Bot' && !endsWith(github.actor, '[bot]') && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # Нужен для аутентификации через GitHub Actions
      contents: read       # Достаточно для чтения кода и diff
      pull-requests: write  # Нужно, чтобы оставлять ревью-комментарии в PR
      issues: write         # Нужно, чтобы оставлять комментарии в PR
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config --global user.name "opencode-bot"
          git config --global user.email "opencode-bot@users.noreply.github.com"

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: opencode/big-pickle
          use_github_token: true
          prompt: |
            Проверь этот pull request:
            - Оцени качество кода
            - Найди потенциальные баги
            - Предложи улучшения
