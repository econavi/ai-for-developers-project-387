name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # Командный gate. Два уровня защиты:
    #
    # 1) Команда должна НАЧИНАТЬ комментарий. Раньше дополнительно проверялось
    #    contains(body, ' /oc'), из-за чего упоминание команды в тексте («а как
    #    работает /oc?») запускало платный прогон агента. Все рабочие сценарии
    #    репозитория используют формат «/oc <запрос>» первой строкой.
    #
    # 2) Комментарии ботов игнорируются по account type, а не по суффиксу [bot]:
    #    суффикс — соглашение, а не гарантия; тип аккаунта надёжнее и ловит
    #    переименованных ботов. Это защита от самозапуска: ответ агента,
    #    процитировавший команду, иначе запускал бы новый прогон по циклу.
    if: |
      github.event.comment.user.type != 'Bot' &&
      (
        startsWith(github.event.comment.body, '/oc') ||
        startsWith(github.event.comment.body, '/opencode')
      )
    runs-on: ubuntu-latest

    # Права записи нужны, чтобы агент мог не только отвечать, но и применять изменения:
    # - contents: write — коммитить и пушить правки (например, по команде /oc fix)
    # - pull-requests: write — создавать/обновлять PR с фиксом
    # - issues: write — комментировать/закрывать issue в ходе триажа
    # - id-token: write — используется action для подтверждения подлинности workflow
    #
    # ВАЖНО: issue_comment публикуют и внешние пользователи, поэтому этот workflow
    # даёт агенту право пушить от имени репозитория. Для учебного проекта это окно,
    # но в проде стоит ограничить триггер комментариями от участников команды.
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # persist-credentials: true + настройка git identity ниже нужны, чтобы
          # агент мог выполнить git commit/push при работе по /oc fix
          persist-credentials: true

      - name: Configure git identity
        # Агент коммитит от имени служебного бота opencode-bot
        run: |
          git config --global user.name "opencode-bot"
          git config --global user.email "opencode-bot@users.noreply.github.com"

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: opencode/big-pickle
          use_github_token: true